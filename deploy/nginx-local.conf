server {
    listen 8088;  # WSL2 NAT: Windows localhost forwarding requires an all-interface guest bind.
    server_name localhost;
    root /caminho/para/o/projeto/site;
    index index.html;
    charset utf-8;
    etag on;
    autoindex off;

    auth_basic "Central de Operacoes";
    auth_basic_user_file /etc/nginx/central_operacoes.htpasswd;

    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
    # Cache only content-addressed, immutable image files. Other files revalidate.
    location ~* "^/media/[0-9a-f]{64}\\.(png|jpe?g|webp|gif|avif)$" {
        try_files $uri =404;
        etag on;
        add_header Cache-Control "public, max-age=604800, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}